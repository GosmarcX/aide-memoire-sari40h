name: Générer les PDF

on:
  push:
    branches: [main]
    paths:
      - 'docs/*.html'
      - '.github/workflows/pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Installer Playwright
        run: |
          npm init -y
          npm i -D playwright
          npx playwright install --with-deps chromium

      - name: Rendre les quatorze modules en PDF
        run: |
          cat > render.mjs <<'RENDER_EOF'
          import { chromium } from 'playwright';
          import { createServer } from 'node:http';
          import { readFile, mkdir } from 'node:fs/promises';
          import { extname, join, normalize } from 'node:path';

          const BASES = [
            'prevention',
            'evaluation',
            'urgences-medicales',
            'urgences-environnement',
            'lesions-tissus-mous',
            'lesions-musculosquelettiques',
            'lesions-traumatiques',
          ];
          const MODULES = [...BASES, ...BASES.map((s) => s + '-en')];

          const TYPES = {
            '.html': 'text/html; charset=utf-8',
            '.js': 'text/javascript; charset=utf-8',
            '.json': 'application/json; charset=utf-8',
            '.css': 'text/css; charset=utf-8',
            '.svg': 'image/svg+xml',
            '.png': 'image/png',
            '.jpg': 'image/jpeg',
            '.pdf': 'application/pdf',
          };

          const server = createServer(async (req, res) => {
            const path = decodeURIComponent(req.url.split('?')[0]);
            const file = join('docs', normalize(path === '/' ? '/index.html' : path));
            try {
              const body = await readFile(file);
              res.writeHead(200, { 'content-type': TYPES[extname(file)] || 'application/octet-stream' });
              res.end(body);
            } catch {
              res.writeHead(404).end('not found');
            }
          });
          await new Promise((r) => server.listen(0, r));
          const base = 'http://127.0.0.1:' + server.address().port;

          await mkdir('docs/pdf', { recursive: true });
          const browser = await chromium.launch();
          const page = await browser.newPage();

          for (const slug of MODULES) {
            await page.goto(base + '/' + slug + '.html', { waitUntil: 'networkidle' });
            await page.waitForFunction(
              () => document.querySelectorAll('doc-page section.page').length > 0,
              null,
              { timeout: 20000 },
            );
            await page.evaluate(() => document.fonts.ready);
            await page.waitForTimeout(800);

            const out = 'docs/pdf/aide-memoire-sari40h-' + slug + '.pdf';
            await page.pdf({ path: out, format: 'Letter', printBackground: true, preferCSSPageSize: true });
            const n = await page.evaluate(() => document.querySelectorAll('doc-page section.page').length);
            console.log(out + ' — ' + n + ' pages');
          }

          await browser.close();
          server.close();
          RENDER_EOF
          node render.mjs
          rm render.mjs

      - name: Commiter les PDF mis à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pdf
          if git diff --staged --quiet; then
            echo "Aucun changement dans les PDF."
          else
            git commit -m "PDF régénérés automatiquement"
            git push
          fi
